<!DOCTYPE html>
<html>

<head>
    <title>Site A</title>
    <style>
        body {
            background-color: #ffebee;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            flex-direction: column;
            text-align: center;
        }

        #targetBtn {
            padding: 16px 32px;
            font-size: 18px;
            background-color: #d32f2f;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            margin-top: 16px;
        }

        #targetBtn:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(211, 47, 47, 0.4);
        }

        #status {
            font-size: 20px;
            margin-top: 20px;
            min-height: 40px;
            color: #333;
            font-weight: bold;
        }

        .speaking {
            color: #d32f2f;
            animation: pulse 0.6s ease-in-out infinite alternate;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
                transform: scale(1);
            }
            100% {
                opacity: 1;
                transform: scale(1.05);
            }
        }
    </style>
</head>

<body>

    <div>
        <h3>Situs A (Origin 1)</h3>
        <button id="targetBtn">Click this button, then PRESS "Enter"</button>
        <div id="status">⏎ Tekan Enter untuk membuka Google & mendengar suara</div>
    </div>

    <script>
        const btn = document.getElementById('targetBtn');
        const statusEl = document.getElementById('status');

        // Fokus ke tombol saat halaman dimuat
        btn.focus();

        // Fungsi untuk mengucapkan satu teks, mengembalikan Promise
        function speakText(text) {
            return new Promise((resolve) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'id-ID';
                utterance.rate = 0.9;
                utterance.pitch = 1.1;
                utterance.volume = 1;
                utterance.onend = resolve;
                utterance.onerror = resolve;
                window.speechSynthesis.speak(utterance);
            });
        }

        // Fungsi utama dengan jeda antar bagian
        async function speakHaloGanteng() {
            const parts = ['halo ganteng', 'halo cantik', 'halo tobrut'];

            for (let i = 0; i < parts.length; i++) {
                statusEl.textContent = `🔊 Mengucapkan "${parts[i]}" ...`;
                statusEl.className = 'speaking';

                await speakText(parts[i]);

                if (i < parts.length - 1) {
                    statusEl.textContent = `⏳ Jeda ...`;
                    await new Promise(resolve => setTimeout(resolve, 600));
                }
            }

            statusEl.textContent = '✅ Selesai! Tekan Enter lagi untuk mengulang.';
            statusEl.className = '';
        }

        // Event listener untuk tombol Enter
        window.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();

                // Hentikan suara yang sedang berjalan (jika ada)
                window.speechSynthesis.cancel();

                // 1. Buka Google di tab baru (navigasi duluan)
                 window.location.href = 'https://www.google.com';

                // 2. Setelah navigasi, putar rangkaian suara di halaman ini
                await speakHaloGanteng();

                // (Opsional) tidak ada navigasi lagi karena sudah buka tab
            }
        });

        // Klik tombol juga fokus ulang
        btn.addEventListener('click', () => {
            btn.focus();
            statusEl.textContent = '✅ Tombol difokuskan. Tekan Enter!';
            statusEl.className = '';
        });
    </script>

</body>

</html>
